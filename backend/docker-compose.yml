# .env feeds two channels: shell interpolation (run from backend/) and env_file for the container.
name: ${STACK_NAME:-aala-land}

services:
  postgres:
    image: postgres:18-alpine
    container_name: ${STACK_NAME:-aala-land}-postgres
    ports:
      - "${DB_HOST_PORT:-5480}:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9.1-alpine
    container_name: ${STACK_NAME:-aala-land}-valkey
    # BullMQ cannot work correctly if the store evicts keys.
    command: ["valkey-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_HOST_PORT:-6470}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${STACK_NAME:-aala-land}-backend
    ports:
      - "${BACKEND_HOST_PORT:-3010}:${PORT:-3010}"
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PORT:-3010}/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  valkey_data:
